<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111311" />
    <title>Sign up — Navi Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="auth-page" data-auth-mode="signup">
    <header class="auth-page-header"><a class="brand" href="/index.html"><span class="brand-mark">n</span><span>navi<span class="brand-light">co.</span></span></a><a class="text-link" href="/index.html">Back to home <span>↗</span></a></header>
    <main class="auth-page-main">
      <section class="auth-card">
        <div class="auth-brand"><span class="brand-mark">n</span></div>
        <div class="eyebrow"><span class="eyebrow-line"></span> THERE'S ROOM FOR YOU</div>
        <h1>Make yourself at home.</h1><p class="auth-intro">Create an account and find your people.</p>
        <div class="oauth-buttons"><button class="oauth-button" data-provider="google"><span>G</span> Continue with Google</button><button class="oauth-button" data-provider="github"><span>⌘</span> Continue with GitHub</button><button class="oauth-button" data-provider="discord"><span>◉</span> Continue with Discord</button></div>
        <div class="auth-divider"><span>OR WITH EMAIL</span></div>
        <form id="auth-form">
          <label for="auth-username">Username<input id="auth-username" name="username" minlength="2" maxlength="32" autocomplete="username" required /></label>
          <label for="auth-email">Email address<input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" /></label>
          <label for="auth-password">Password<input id="auth-password" name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters" /></label>
          <button class="button button-accent auth-submit" id="auth-submit" type="submit">Create account <span>↗</span></button>
          <div class="form-message" id="auth-feedback" role="status"></div>
        </form>
        <p class="auth-switch">Already one of us? <a href="/login.html">Log in</a></p>
        <p class="auth-legal">By joining, you agree to be kind and follow our community guidelines.</p>
      </section>
    </main>
    <script type="module" src="/src/auth.js"></script>
  </body>
</html>
